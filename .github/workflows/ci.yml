name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pins "8.0.0" with rollForward=latestMinor — that rollForward is a
      # runtime SDK-selection hint, not something actions/setup-dotnet's global-json-file
      # input honors when *acquiring* the SDK; it tries to install the literal 8.0.0 GA
      # patch, which is no longer in the install feed. Float to latest 8.0.x instead —
      # global.json's rollForward then happily accepts whatever patch that resolves to.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      # Repo builds clean with 0 warnings today (verified 2026-07-12) — enforce it.
      - name: Build
        run: dotnet build --configuration Release --no-restore /warnaserror

      # Public, checksum-verified download (scripts/download-models.sh) — no secret involved.
      # Enables the Testcontainers-backed EnricherIntegration tests below instead of
      # letting them silently no-op on a missing EMBEDDINGS__MODELPATH.
      #
      # Split into restore/save (rather than the combined actions/cache) because that
      # action's save step carries a built-in post-if: success() — it silently skips
      # saving whenever a later step in the job fails, no matter what `if:` is set on
      # the step itself. A failing Test step would otherwise mean every run re-downloads
      # 448 MB, forever, even after the model itself is already known-good and cached.
      - name: Restore ONNX embedding model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: models/multilingual-e5-small/model.onnx
          key: onnx-e5-small-${{ hashFiles('scripts/download-models.sh') }}

      - name: Download ONNX embedding model
        run: ./scripts/download-models.sh

      # Category=Eval and Category=Smoke call the real Anthropic API and require
      # ANTHROPIC_API_KEY. We never put that key in CI, so those traits are excluded
      # here rather than left to fail (Smoke throws without the key) or silently
      # no-op (Eval). Everything else, including the Testcontainers-backed
      # EnricherIntegration tests (real Postgres+pgvector container via Docker,
      # which ubuntu-latest ships with), runs for real.
      - name: Test
        env:
          EMBEDDINGS__MODELPATH: ${{ github.workspace }}/models/multilingual-e5-small/model.onnx
        run: >
          dotnet test --configuration Release --no-build
          --filter "Category!=Eval&Category!=Smoke"
          --logger "trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Save ONNX embedding model cache
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: models/multilingual-e5-small/model.onnx
          key: onnx-e5-small-${{ hashFiles('scripts/download-models.sh') }}
