app = "hanwas-ai"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[checks]]
  name = "health"
  port = 8080
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  path = "/health"
