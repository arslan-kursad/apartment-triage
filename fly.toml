app = "apartment-triage"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[checks]]
  name = "health"
  port = 8080
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  path = "/health"
