  announcement:
    description_en: "Announcement/info, not a ticket"
    description_tr: "Duyuru, bilgi paylaşımı — ticket değil"
    baseline_priority: n_a
    subtypes:  # NEW v2
      regular_announcement:
        description_tr: "Apartman içi duyuru (toplantı, bakım programı, vs.)"
        skip_ticket: true
        notify_resident: false
        notify_manager: false
      external_outage:
        description_tr: "Şehir kaynaklı kesinti (İSKİ, BEDAŞ, doğalgaz dağıtım, vs.)"
