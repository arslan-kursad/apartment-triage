  gas:
    description_en: "Natural gas, gas-side of combi boiler, gas odor or leak"
    description_tr: "Doğalgaz, kombi gaz tarafı, gaz kokusu/kaçağı"
    baseline_priority: urgent

  heating_cooling:
    description_en: "Boiler heat side, radiators, AC, climate equipment"
    description_tr: "Kombi (ısı tarafı), kalorifer, klima, radyatör"
    baseline_priority: medium

  elevator:
    description_en: "Elevator malfunction, getting stuck, door issues"
    description_tr: "Asansör arızası, mahsur kalma, kapı sorunu"
    baseline_priority: high

  structural:
    description_en: "Cracks, roof, windows, doors, balcony, facade, external water ingress"  # CHANGED v2
    description_tr: "Çatlak, çatı (su sızıntısı dahil), pencere, kapı, balkon, dış cephe"  # CHANGED v2
    baseline_priority: medium

  common_area:
    description_en: "Stairwell, entrance, parking, garden, attic, cleaning"
    description_tr: "Merdiven, giriş, otopark, bahçe, çatı katı, temizlik"
    baseline_priority: low

  pest:
    description_en: "Rodents, insects, pigeons, infestation"
    description_tr: "Fare, hamamböceği, güvercin, karınca, haşere"
    baseline_priority: low

  noise:
    description_en: "Noise complaint"
    description_tr: "Gürültü şikayeti"
    baseline_priority: low

  neighbor_dispute:
    description_en: "Non-noise inter-resident dispute"
    description_tr: "Gürültü dışı komşu anlaşmazlığı"
    baseline_priority: low
