version: v4
created_at: 2026-05-20
supersedes: v3
status: locked
pm_review_completed: 2026-05-20

locked_decisions:
  neighbor_dispute_as_separate_category: true
  multi_issue_strategy: multi_ticket
  emergency_layer: hybrid_phrase_set_layer1_llm_layer2_confirmation_required
  utility_outage_subtype: true
  cause_effect_handling: single_ticket_severity_upgrade
  same_category_split_rule: location_based
  swap_cause_no_severity_upgrade: true  # NEW v4 — Interpretation B locked

