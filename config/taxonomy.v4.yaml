        info_only: true
        notify_resident: false
        notify_manager:  # NEW v2
          mode: dashboard_toggle
          default: off
          storage_key: dashboard.settings.notify_external_outage
        examples_tr:
          - "Yarın 10:00-14:00 arası su kesintisi olacak"
          - "BEDAŞ'tan mesaj geldi, akşam elektrik gidecek"
          - "İGDAŞ doğalgaz bakım, bu hafta sonu"

