  billing:
    description_en: "Dues, invoices, payment disputes"
    description_tr: "Aidat, fatura, ödeme uyuşmazlığı"
    baseline_priority: low

  security:
    description_en: "Locks, cameras, suspicious activity, break-ins"
    description_tr: "Kapı/kilit, kamera, şüpheli aktivite, hırsızlık"
